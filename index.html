<!doctype html>
<html lang="es-PY">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#223512">
  <title>Yvy Guaraní S.A. — Tienda y gestión</title>
  <link rel="icon" href="assets/logo-yvy.jpg">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip" href="#/" data-act="skip">Saltar al contenido</a>
  <header class="top" id="top">
    <a class="brand" id="brand" href="#/inicio"></a>
    <nav class="topnav" id="topnav" aria-label="Tienda"></nav>
    <div class="top-actions" id="top-actions"></div>
  </header>
  <div class="viewas" id="viewas" role="status" hidden></div>
  <div class="shell" id="shell">
    <nav class="side" id="side" aria-label="Secciones"></nav>
    <main id="main" tabindex="-1"></main>
  </div>
  <nav class="bottom" id="bottom" aria-label="Secciones principales"></nav>
  <dialog id="dlg" aria-labelledby="dlg-title"></dialog>
  <button class="updatebar" id="update" type="button" data-act="actualizar" hidden>Hay cambios de otras personas · Actualizar</button>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:16px">Esta aplicación necesita JavaScript.</p></noscript>
  <script src="js/domain.js"></script>
  <script src="js/catalogo.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
